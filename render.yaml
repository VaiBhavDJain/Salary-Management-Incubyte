services:
  - type: web
    name: salary-management
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salary-management-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"

databases:
  - name: salary-management-db
    plan: free
    databaseName: salary_management
    user: salary_management
